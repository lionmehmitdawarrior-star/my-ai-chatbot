<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>میرا AI چیٹ بوٹ</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 20px;
    }

    .chat {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    h2 {
      text-align: center;
    }

    #message {
      width: 70%;
      padding: 12px;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    #reply {
      margin-top: 20px;
      padding: 15px;
      background: #eee;
      border-radius: 10px;
      min-height: 30px;
    }
  </style>
</head>

<body>

  <div class="chat">
    <h2>🤖 میرا AI چیٹ بوٹ</h2>

    <input id="message" type="text" placeholder="اپنا سوال لکھیں">

    <button onclick="sendMessage()">بھیجیں</button>

    <div id="reply">یہاں AI کا جواب آئے گا۔</div>
  </div>data.reply

  <script>
    async function sendMessage() {
      const message = document.getElementById("message").value;

      if (!message) {
        document.getElementById("reply").innerText =
          "براہِ کرم پہلے سوال لکھیں۔";
        return;
      }

      document.getElementById("reply").innerText =
        "جواب تیار ہو رہا ہے...";document.getElementById("reply").innerText =
  "جواب تیار ہو رہا ہے...";
    }
  </script>

</body>
</html>
