<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>میرا AI چیٹ بوٹ</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 20px;
    }

    .chat {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-sizing: border-box;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    .input-area {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #message {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      box-sizing: border-box;
      border: 1px solid #aaa;
      border-radius: 8px;
    }

    button {
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
      border: 1px solid #aaa;
      border-radius: 8px;
    }

    #reply {
      margin-top: 20px;
      padding: 15px;
      background: #eee;
      border-radius: 10px;
      min-height: 30px;
      white-space: pre-wrap;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="chat">

    <h2>🤖 میرا AI چیٹ بوٹ</h2>

    <div class="input-area">

      <input
        id="message"
        type="text"
        placeholder="اپنا سوال لکھیں"
        autocomplete="off"
      >

      <button type="button" onclick="sendMessage()">
        بھیجیں
      </button>

    </div>

    <div id="reply">
      یہاں AI کا جواب آئے گا۔
    </div>

  </div>

  <script>
    async function sendMessage() {

      const input = document.getElementById("message");
      const output = document.getElementById("reply");

      const message = input.value.trim();

      if (!message) {
        output.innerText = "براہِ کرم پہلے سوال لکھیں۔";
        return;
      }

      output.innerText = "جواب تیار ہو رہا ہے...";

      try {

        const response = await fetch("/api/chat2", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: message
          })
        });

        const result = await response.json();

        if (!response.ok) {
          output.innerText =
            result.error || "سرور میں مسئلہ ہے۔";
          return;
        }

        output.innerText =
          result.answer || "AI کی طرف سے کوئی جواب نہیں آیا۔";

      } catch (error) {

        output.innerText =
          "سرور سے رابطہ نہیں ہو سکا۔";
      }
    }
  </script>

</body>

</html>
